services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        APP_USER_ID: 1000
        APP_USER_NAME: appuser
    ports:
      - "8080:8080"
    environment:
      APP_ENV: dev
      APP_SECRET: "51acc9f3d0089ef580fd480d021fe467"
    volumes:
      - ./:/app
      - home_appuser:/home/appuser/
    # `rr serve -c .rr/rr-kitchen.yaml`
    command: "tail -f /dev/null"
    depends_on:
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: demo
      RABBITMQ_DEFAULT_PASS: demo
      RABBITMQ_NODENAME: demo@localhost
    ports:
      - "5672:5672"
      - "15672:15672" # management UI: demo/demo
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Single-node KRaft mode (no Zookeeper) — doc/09_architecture.md §5's
  # broker assignment only needs one broker of each kind for this pass.
  kafka:
    image: apache/kafka:latest
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15

  kafka-init:
    image: apache/kafka:latest
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./.docker/kafka/create-topics.sh:/create-topics.sh
    entrypoint: ["/bin/bash", "/create-topics.sh"]

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    restart: on-failure
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
    ports:
      - "8081:8080"
    volumes:
      - .docker/kafka-ui/config.yaml:/etc/kafkaui/dynamic_config.yaml

volumes:
  home_appuser: